<h2 mat-dialog-title>{{ datos.titulo }}</h2>

<mat-dialog-content>
  <p>{{ datos.mensaje }}</p>
</mat-dialog-content>

<mat-dialog-actions class="dialogo__acciones">
  @if (datos.textoSecundario) {
    <button type="button" class="btn btn--secundario" [mat-dialog-close]="'secundaria'">
      {{ datos.textoSecundario }}
    </button>
  }
  <button type="button" class="btn btn--primary" [mat-dialog-close]="'principal'" cdkFocusInitial>
    {{ datos.textoPrincipal }}
  </button>
</mat-dialog-actions>
