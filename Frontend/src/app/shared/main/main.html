
<div class="app-grid-layout" [class.sin-aside]="!menu.hayItems()">

  <header class="area-header">
    @if (menu.hayItems()) {
      <button
        matIconButton
        class="btn-hamburguesa"
        type="button"
        [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'"
        aria-controls="menu-lateral"
        [attr.aria-expanded]="menuAbierto()"
        (click)="toggleMenu()"
      >
        <mat-icon aria-hidden="true">
          {{ menuAbierto() ? 'close' : 'menu' }}
        </mat-icon>
      </button>
    }

    <app-header />
  </header>

  @if (menu.hayItems()) {
    <aside
      id="menu-lateral"
      class="area-aside"
      [class.abierto]="menuAbierto()"
    >
      <div class="aside-contenido">
        <app-aside (navegar)="menuAbierto.set(false)" />
      </div>
    </aside>
  }

  <main class="area-main">
    <router-outlet />
  </main>

  <footer class="area-footer">
    <app-footer />
  </footer>

</div>

@if (menuAbierto()) {
  <button
    class="overlay"
    type="button"
    aria-label="Cerrar menú"
    (click)="menuAbierto.set(false)"
  ></button>
}
