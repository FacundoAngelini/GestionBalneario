<div class="card-premium">
  <h2 class="auth-title">ArenaDesk</h2>
  <p class="auth-subtitle">Ingresa a tu cuenta</p>
  
  @if (errorMsg()) {
    <div class="alert-error">{{ errorMsg() }}</div>
  }

  <form (ngSubmit)="ingresar()" class="auth-form">
    <div class="form-group">
      <label for="user">Usuario</label>
      <input id="user" type="text" [(ngModel)]="credenciales.nombreUsuario" name="usuario" required />
    </div>

    <div class="form-group">
      <label for="pass">Contraseña</label>
      <input id="pass" type="password" [(ngModel)]="credenciales.contrasenia" name="pass" required />
    </div>

    <button type="submit" class="btn-primary" [disabled]="cargando()">
      {{ cargando() ? 'Cargando...' : 'Entrar' }}
    </button>
  </form>

  <p class="auth-footer">¿Nuevo cliente? <a routerLink="/auth/registro">Regístrate aquí</a></p>
</div>
