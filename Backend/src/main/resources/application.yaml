spring:
  application:
    name: MiBalnearioGestion

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    from: ${MAIL_FROM}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 100
      thread-name-prefix: async-
      shutdown:
        await-termination: true
        await-termination-period: 60s

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

mp:
  accesstoken: ${MP_ACCESS_TOKEN}
  webhook: "${MP_WEBHOOK_URL}/api/v1/public/webhooks/mercadopago"
  backurl:
    success: "${MP_REDIRECT_URL}/pago-exitoso"
    failure: "${MP_REDIRECT_URL}/pago-fallido"
  backurls:
    success: "${MP_REDIRECT_URL}/pago-exitoso"
    failure: "${MP_REDIRECT_URL}/pago-fallido"

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:4200}

logging:
  level:
    org.springframework.security: DEBUG
