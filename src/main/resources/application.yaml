spring:
  application:
    name: MiBalnearioGestion

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

mp:
  secret: ${MP_ACCESSTOKEN}

mail:
    host: smtp.gmail.com
    port: 587
    username: balnearioapiutn@gmail.com
    password: ${GMAIL_APP}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enabled: true
