spring:
  application:
    name: MiBalnearioGestion

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME} //esto es lo unico que cambia y password
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true